<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       * {
           box-sizing: border-box;
       }

       .main{
           width: 100%;
           min-height: 300px;
           background-color: red;
           border: 1px solid black;
           padding: 10px;
           margin: 3px;
       }

       #box1{
           width: 100%;
           min-height: 100px;
           background-color: blue;
           display: flex;
           flex-wrap: wrap;
           gap: 4px;
       }

       #b1{
        flex: 1 1 40%;
        height: 80px;
        margin: 10px; 
        padding-top: 5px;
        background-color: rgb(251, 251, 19);
       }

       #b2{
        flex: 1 1 20%;
        height: 80px;
        margin: 10px; 
        border-radius: 100px;
        padding: 3px;
        background-color: green;
       }

       #b3{
        flex: 1 1 10%;
        height: 80px;
        margin: 10px; 
        padding: 3px;
        background-color: rgb(105, 108, 105);
       }

       #box2{
           width: 100%;
           min-height: 100px;
           background-color: green;
           margin-top: 4px;
       }
       #b4{
         width:45%;
        height: 80px;
        margin: 10px; 
        padding: 3px;
        display: inline-flex;
        display:inline-flexbox;
        background-color: rgb(14, 142, 241);
       }
       #b5{
         width: 40%;;
        height: 80px;
        margin: 10px; 
        padding: 3px;
        display: inline-flex;
        display:inline-flexbox;
        background-color: rgb(249, 9, 193);
       }
       #b6{
         width: 80px ;
        height: 80px;
        margin: 10px; 
        padding: 3px;
        border-radius: 50%;
        display: inline-flex;
        display:inline-flexbox;
        background-color: rgb(117, 181, 227);
       }
      

       #box3{
           width: 100%;
           min-height: 100px;
           background-color: yellow;
           margin-top: 4px;
       }
    </style>
</head>
<body>
    <div class="main">
        <div id="box1" >
            <div id="b1"></div>
            <div id="b2"></div>
            <div id="b3"></div>
        </div>

        <div id="box2"> 

            <div id="b4"></div>
            <div id="b5"></div>
            <div id="b6"></div>
        </div>

        <div id="box3">
            <div id="b7"></div>
            <div id="b8"></div>
            <div id="b9"></div>

        </div>
    </div>  
</body>
</html>
