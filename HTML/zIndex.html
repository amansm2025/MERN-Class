<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-Index Reverse Boxes</title>

  <style>

    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#eaeaea;
    }

    .container{
      position:relative;
      width:700px;
      height:700px;
    }

    .box{
      position:absolute;
      width:120px;
      height:120px;
      color:white;
      font-size:22px;
      font-weight:bold;
      display:flex;
      justify-content:center;
      align-items:center;
      border-radius:12px;
    }

    

    .box1{ 
        background:red; top:0; left:0; z-index:1; 
    }
    .box2{ 
        background:blue; top:30px; left:30px; z-index:2; 
    }
    .box3{ 
        background:green; top:60px; left:60px; z-index:2; 
    }
    .box4{
         background:purple; top:90px; left:90px; z-index:1; 
        }
    

    
    .box6{ background:brown; top:250px; left:250px; z-index:10; }
    .box7{ background:pink; top:280px; left:280px; z-index:9; }
    .box8{ background:teal; top:310px; left:310px; z-index:8; }
    .box9{ background:black; top:340px; left:340px; z-index:7; }
    .box10{
      background:gold;
      color:black;
      top:370px;
      left:370px;
      z-index:6;
    }

  </style>
</head>

<body>

  <div class="container">

    
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>

    
    <div class="box box6"></div>
    <div class="box box7"></div>
    <div class="box box8"></div>
    <div class="box box9"></div>
    <div class="box box10"></div>

  </div>

</body>
</html>
