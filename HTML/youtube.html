<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f1f1f1;
}


#header{
    width:100%;
    height:60px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid #ccc;
}

#logo{
    font-size:25px;
    font-weight:bold;
    color:red;
}

#search{
    width:40%;
    display:flex;
}

#search input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
}

#search button{
    padding:10px 20px;
    border:none;
    background:red;
    color:white;
}



#main{
    display:flex;
}



#sidebar{
    width:220px;
    height:100vh;
    background:white;
    padding:20px;
    border-right:1px solid #ccc;
}

.menu{
    padding:15px;
    margin-bottom:10px;
    background:#f5f5f5;
    border-radius:8px;
}



#videos{
    flex:1;
    padding:20px;

    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.video-box{
    width:300px;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 5px rgba(0,0,0,0.2);
}

.thumbnail{
    width:100%;
    height:170px;
    background:gray;
}

.video-content{
    padding:15px;
}

.video-content h3{
    margin-bottom:10px;
}

.video-content p{
    color:#555;
}

</style>
</head>

<body>



<div id="header">

    <div id="logo">YouTube</div>

    <div id="search">
        <input type="text" placeholder="Search">
        <button>Search</button>
    </div>

    <div></div>

</div>


<div id="main">

   

    <div id="sidebar">

        <div class="menu">Home</div>
        <div class="menu">Shorts</div>
        <div class="menu">Subscriptions</div>
        <div class="menu">Library</div>

    </div>

   

    <div id="videos">

        <div class="video-box">

            <div class="thumbnail"></div>

            <div class="video-content">
                <h3>Video Title 1</h3>
                <p>Channel Name</p>
            </div>

        </div>

        <div class="video-box">

            <div class="thumbnail"></div>

            <div class="video-content">
                <h3>Video Title 2</h3>
                <p>Channel Name</p>
            </div>

        </div>

        <div class="video-box">

            <div class="thumbnail"></div>

            <div class="video-content">
                <h3>Video Title 3</h3>
                <p>Channel Name</p>
            </div>

        </div>

        <div class="video-box">

            <div class="thumbnail"></div>

            <div class="video-content">
                <h3>Video Title 4</h3>
                <p>Channel Name</p>
            </div>

        </div>

    </div>

</div>

</body>
</html>
