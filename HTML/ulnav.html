<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .main {
      display: flex;
      justify-content: space-between; 
      align-items: center;
      background-color: black;
      width: 100%;
      height: 70px;
      
      border-radius: 12px;
      
      margin-right: 10px;
    }

    #logo {
      height: 60px;
      width: 60px;
      border-radius: 50%;
      margin-left: 10px;
      background-color: chartreuse; 
    }

    .main ul {
      display: flex;
      gap: 20px; 
      list-style: none;
      margin: 0;
      padding: 0;
      margin-right: 10px;
      justify-content: right;
    }

    .main ul li {
      background-color: hsl(69, 94%, 50%);
      padding: 10px 15px;
      border-radius: 5px;
      color: black;
      font-weight: bold;
     
    }
   .main .input{
        height: 50px;;
        width: 800px;
        border-radius: 50px;
    }

   
  </style>
</head>
<body>
  <div class="main">
    <div id="logo"></div>
    <div id="search">
        <input type="text" class="input">
    </div>
    <ul>
      <li>Home</li>
      <li>Contact</li>
      <li>About</li>
      <li>Menu</li>
      <li>Features</li>
    </ul>
  </div>
</body>
</html>
