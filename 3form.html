<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <!-- wed -->
    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
        </audio>    

    <h1>Form</h1>

    <form action="https://www.google.com" method="get">
        <fieldset>


            <legend> <b> Personal Information</b></legend>


            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Name" required><br><br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="user@gmail.com" required><br><br>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="e.g 12fdre45" required><br><br>

            <label for="Search">Search</label>
            <input type="text" id="Search" name="Search" placeholder="Search..." required><br><br>

            <label for="number">Number</label>
            <input type="number" id="number" name="number" placeholder="Enter number" required><br><br>

            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="Enter age" required><br><br>
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
            <br><br>
        </fieldset>
        <label for="time">Time</label>
        <input type="time" id="time" name="time" required>
        <br><br>

        <input type="submit" value="Submit">
    </form>

    <h1>video</h1>
    <video width="320" height="240" controls autoplay loop>
        <source src="video.mp4" type="video/mp4">

    </video>

    <h1><b>SONG</b></h1>
    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
    </audio>
    <h1>Embedding</h1>
    <iframe width="100%" height="100" src="https://www.youtube.com/embed/yhb1UjE6I1U?si=kQqAZhB0v-C7fOh3"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen> </iframe>

    
</body>

</html>
