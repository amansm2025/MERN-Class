<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        #header{
            width:100%;
            height:50px;
            background-color:red;
            text-align:center;
            line-height:50px;
        }

        #nav{
            width:100%;
            height:50px;
            background-color:yellow;
            text-align:center;
            line-height:50px;
        }

        .main{
            width:100%;
            padding:10px;
        }

        .body{
            width:70%;
            height:300px;
            background-color:gray;
            display:inline-block;
            vertical-align:top;
            text-align:center;
        }

        #b1,#b2{
            width:35%;
            height:200px;
            background-color:blue;
            display:inline-block;
            margin:30px 10px;
            color:white;
            line-height:200px;
        }

        #b3{
            width:25%;
            height:300px;
            background-color:green;
            display:inline-block;
            vertical-align:top;
            margin-left:10px;
            text-align:center;
            color:white;
            line-height:300px;
        }

        #footer{
            width:100%;
            height:50px;
            background-color:red;
            text-align:center;
            line-height:50px;
            margin-top:10px;
        }

    </style>
</head>

<body>

    <div id="header">
        Header
    </div>

    <div id="nav">
        Navbar
    </div>

    <div class="main">

        <div class="body">

            <div id="b1">
                Body A
            </div>

            <div id="b2">
                Body B
            </div>

        </div>

        <div id="b3">
            Body C
        </div>

    </div>

    <div id="footer">
        Footer
    </div>

</body>
</html>
